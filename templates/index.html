<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceDekho</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f1f5f9; padding: 15px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: #2563eb; }
    .search-box { display: flex; max-width: 500px; margin: 0 auto 20px auto; gap: 8px; }
    .search-box input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .search-box button { padding: 12px 20px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 900px; margin: 0 auto; }
    @media(min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    .card { background: #fff; border-radius: 8px; padding: 12px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; }
    .card h4 { font-size: 13px; margin-bottom: 6px; color: #1e293b; height: 36px; overflow: hidden; }
    .card .store { font-size: 11px; font-weight: bold; text-transform: uppercase; color: #64748b; margin-bottom: 4px; }
    .card .price { font-size: 14px; font-weight: bold; color: #16a34a; margin-bottom: 10px; }
    .card a { display: block; text-align: center; background: #f59e0b; color: #111; text-decoration: none; padding: 8px; border-radius: 6px; font-weight: bold; font-size: 12px; }
    .card.flipkart a { background: #2563eb; color: #fff; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Price<span>Dekho</span></h1>
  </div>

  <form action="/" method="GET" class="search-box">
    <input type="text" name="q" value="{{ query }}" placeholder="Search mobile, earphones..." required>
    <button type="submit">Search</button>
  </form>

  {% if deals %}
    <h3 style="max-width: 900px; margin: 0 auto 12px auto; font-size: 15px;">Deals for "{{ query }}":</h3>
    <div class="grid">
      {% for deal in deals %}
        <div class="card {% if deal.store == 'Flipkart' %}flipkart{% endif %}">
          <div>
            <div class="store">{{ deal.store }}</div>
            <img src="{{ deal.image }}" alt="{{ deal.title }}">
            <h4>{{ deal.title }}</h4>
            <div class="price">{{ deal.price_raw }}</div>
          </div>
          <a href="{{ deal.affiliate_url }}" target="_blank" rel="noopener noreferrer">
            Buy on {{ deal.store }}
          </a>
        </div>
      {% endfor %}
    </div>
  {% elif query %}
    <p style="text-align: center; color: #64748b;">No results found.</p>
  {% endif %}

</body>
</html>
